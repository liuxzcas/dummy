[pytest]
testpaths = tests

# ============================================================
# 测试分组(2026-11-23)
# ============================================================
# 为什么分组:全量 ~93 秒且随数据增长(曾因 FTS 全量重建涨到 3:43)。小改动
# 没必要每次跑全部 —— 按"改哪里跑哪里"选组,提交前再跑全量。
#
#   pytest -m fast          快组:纯逻辑/解析/格式化,不启动子进程(~10s)
#   pytest -m core          核心组:工具循环、历史、压缩、会话存取(~30s)
#   pytest -m slow          慢组:真跑子进程/超时/进程树(~40s)
#   pytest                  全量(默认)
#
# 新测试请打标:模块级 `pytestmark = pytest.mark.fast` 或逐条装饰。
# 未打标的测试默认归入"全量",不会被 -m fast 选中 —— 宁可漏跑也不误跑。
markers =
    fast: 纯逻辑,不启动子进程、不访问网络(秒级)
    core: 工具循环/历史/压缩/会话存取(十秒级)
    slow: 真跑子进程、超时、进程树(几十秒)
